[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lanshare"
version = "1.0.0"
description = "Fast, encrypted file sharing between devices on the same Wi-Fi network or hotspot - no internet or Bluetooth required."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "lanshare contributors" }
]
keywords = ["file-sharing", "lan", "wifi", "hotspot", "peer-to-peer", "transfer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/j33by/lanshare"
Issues = "https://github.com/j33by/lanshare/issues"

[project.scripts]
lanshare = "lanshare.cli:main"

[tool.setuptools.packages.find]
include = ["lanshare*"]
